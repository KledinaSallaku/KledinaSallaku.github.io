:root{

  --text:"Saira Semi Condensed","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.42,.08,.2,1);
}

#app{position:relative;z-index:1;height:100%;display:grid;

.view{grid-area:1/1;min-width:0;min-height:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s ease, visibility 0s linear .45s}
#app[data-view="home"] .home,#app[data-view="book"] .book{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .6s ease .08s, visibility 0s}

const LAST = BOOK.sheets - 1, RATIO = 840 / 297;

const cv = { ul: $('#cUL'), ur: $('#cUR'), f: $('#cF'), b: $('#cB') };
const tints = { ul: $('#tUL'), ur: $('#tUR'), f: $('#tF'), b: $('#tB') };

const aim = () => (pending !== null ? pending : (heading !== null ? heading : cur));   // where the reader is heading, turns in progress included
const isSingle = i => i === 0 || i === LAST;
const url = (i, tier) => 'pages/' + tier + String(i + 1).padStart(2, '0') + '.webp';
const imgs = new Map();
function img(i, tier) {

function trim() { for (const key of Array.from(imgs.keys())) { const i = +key.slice(1); if (Math.abs(i - cur) > (key[0] === 'z' ? 0 : 3)) imgs.delete(key); } }

function paintRest(im, i) {

function frameFor(i, ms) {

/* a rigid leaf turns about the spine: its front is the right page of the earlier spread, its back the left page of

async function turn(to, fast) {

    else await swap(to, !painted || !!o.instant || reduced);

}
/* printed page numbers: sheet k holds 2k-2 and 2k-1; the cover and the inside cover carry none */
const sections = [{ title: 'About', page: 1 }, { title: 'Contents', page: 2 }];
BOOK.chapters.forEach(c => { if (c.page != null) sections.push({ title: c.title, page: c.page }); c.projects.forEach(p => sections.push({ title: p.title, page: p.page })); });
sections.sort((a, b) => a.page - b.page);
const sheetOf = page => Math.max(0, Math.min(LAST, Math.floor((page + 2) / 2)));
function labelFor(i, page) {
  if (i === 0) return 'Cover';
  const ref = page != null ? page : (i === LAST ? 2 * i - 2 : 2 * i - 1);
  let t = ''; for (const s of sections) { if (s.page <= ref) t = s.title; }
  return t || 'Portfolio';
}
function settle() {
  const l = 2 * cur - 2, r = 2 * cur - 1;
  $('#num').textContent = cur === 0 ? 'Cover' : (cur === LAST ? String(l) : (l >= 1 ? l + ' – ' + r : String(r)));
  $('#where').textContent = labelFor(cur);
  $('#prog').style.width = (cur / LAST * 100) + '%';
  $('#prev').disabled = cur === 0; $('#next').disabled = cur === LAST;
  trim();
  [cur + 1, cur - 1, cur + 2].forEach(i => { if (i >= 0 && i <= LAST) img(i).catch(() => {}); });
  clearTimeout(upT);
  if (mode === 'spreads' && sheetW * Math.min(window.devicePixelRatio || 1, 2) > 3000) {
    const i = cur; upT = setTimeout(() => { img(i, 'z').then(im => { if (i === cur && !busy && mode === 'spreads') paintRest(im, i); }, () => {}); }, 450);
  }
}
/* ---- one page per row for narrow, upright screens */
let pagesBuilt = false, io = null, scrollT = 0;
function buildPages() {
  if (pagesBuilt) return; pagesBuilt = true;
  io = new IntersectionObserver(es => es.forEach(e => {
    const d = e.target, s = +d.dataset.s;
    if (e.isIntersecting) { d.style.backgroundImage = 'url("' + url(s, 's') + '")'; d.style.backgroundSize = isSingle(s) ? '100% 100%' : '200% 100%'; d.style.backgroundPosition = d.dataset.side === 'L' ? 'left top' : 'right top'; }
    else d.style.backgroundImage = '';
  }), { root: scroller, rootMargin: '160% 0px' });

  for (let a = 1; a <= BOOK.pages; a++) {
    const d = document.createElement('button');
    d.className = 'pg'; d.dataset.s = a === 1 ? 0 : Math.floor(a / 2); d.dataset.side = a % 2 === 0 ? 'L' : 'R'; d.dataset.abs = a;
    d.setAttribute('aria-label', (a > 2 ? 'Page ' + (a - 2) : 'Cover page') + '. Tap to zoom.');

  }

  scroller.querySelectorAll('.pg').forEach(d => io.observe(d));
  scroller.addEventListener('click', e => {
    const d = e.target.closest('.pg'); if (!d) return;
    const b = d.getBoundingClientRect(), s = +d.dataset.s, lx = (e.clientX - b.left) / b.width, ly = (e.clientY - b.top) / b.height;
    openZoom(s, isSingle(s) ? (s === 0 ? 0.5 + lx / 2 : lx / 2) : (d.dataset.side === 'L' ? lx / 2 : 0.5 + lx / 2), ly);

function trackScroll() {

  $('#num').textContent = a <= 2 ? (a === 1 ? 'Cover' : '–') : String(a - 2);

function scrollToSheet(i, instant, page) {
  const abs = page != null ? page + 2 : (i === 0 ? 1 : 2 * i), d = scroller.children[Math.max(0, Math.min(BOOK.pages, abs) - 1)];

  if (!booted) { booted = true; go(target, { instant: true, force: true }); }

    const sec = document.createElement('section'); sec.className = 'chap';
    const h = document.createElement('h2'); h.textContent = c.title;
    const ol = document.createElement('ol');

      const li = document.createElement('li'), b = document.createElement('button'), t = document.createElement('span'), n = document.createElement('b');
      t.textContent = p.title; n.textContent = p.page; b.appendChild(t); b.appendChild(n);

$('#prev').addEventListener('click', () => go(aim() - 1));
$('#next').addEventListener('click', () => go(aim() + 1));
$('#toHome').addEventListener('click', () => setView('home'));
$('#openIndex').addEventListener('click', () => openOver('index'));
$('#openResume').addEventListener('click', () => openOver('resume'));
$('#openContact').addEventListener('click', () => { setView('home'); openContact(true); });
rest.addEventListener('click', e => {
  if (busy || performance.now() - swiped < 400) return;
  const b = sheet.getBoundingClientRect();
  openZoom(cur, (e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height);
});
(function swipe() {

  stage.addEventListener('pointerup', e => {
    if (e.pointerId !== id) return; id = null;

/* ---- zoom: the spread at reading size, panned by scrolling or dragging. fx, fy are fractions of the whole sheet. */
const zoom = $('#zoom'), zimg = $('#zoomImg');

/* ============================================================== keys and deep links == */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!zoom.hidden) closeZoom(); else closeOvers(); return; }
  if (app.dataset.view !== 'book' || !zoom.hidden || document.querySelector('.over:not([hidden])') || mode !== 'spreads') return;
  const base = aim();
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(base + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(base - 1); }

function route() {
  const h = (location.hash || '').replace('#', '');

  if (m) enterBook(+m[1]);
